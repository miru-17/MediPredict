<!DOCTYPE html>
<html>
<head>
<title>MediPredict</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background-image:url("/static/images/bg.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* Header */
.header{
    background:#0d2a52;
    color:white;
    padding:40px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
}

/* Sidebar */
.sidebar{
    position:fixed;
    left:0;
    top:110px;
    width:240px;
    height:100%;
    background:#ff2a5a;
    padding-top:20px;
}

.sidebar a{
    display:block;
    color:white;
    padding:11px;
    text-decoration:none;
    font-size:16px;
}

.sidebar a:hover{
    background:#e11d48;
}

/* Main */
.main{
    margin-left:240px;
    margin-top:120px;
    padding:40px;
}

/* Form Box */
.form-container{
    background:white;
    width:500px;
    margin:auto;
    padding:50px;
    border-radius:10px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.2);
}

.form-group{
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

input, select{
    width:100%;
    padding:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

.next-btn{
    width:100%;
    padding:12px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.next-btn:hover{
    box-shadow:0 0 15px #2563eb;
    transform:scale(1.05);
}

</style>
</head>

<body>

<div class="header">
MediPredict – Health Risk Analyser
</div>

<div class="sidebar">
<a href="#">Predict Disease</a>
<a href="#">View Health Recommendations</a>
<a href="#">Profile</a>
<!--<a href="#">Download Report</a>-->
<a href="#">Logout</a>
</div>

<div class="main">

<div class="form-container">

<h2>PERSONAL INFORMATION</h2>

<form action="/save_personal_info" method="POST">

<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Age</label>
<input type="number" name="age" required>
</div>

<div class="form-group">
<label>Gender</label>
<select name="gender" required>
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
</select>
</div>


<div class="form-group">
<label>Height (cm)</label>
<input type="number" id="height" name="height" oninput="calculateBMI()" required>
</div>

<div class="form-group">
<label>Weight (kg)</label>
<input type="number" id="weight" name="weight" oninput="calculateBMI()" required>
</div>

<div class="form-group">
<label>BMI</label>
<input type="text" id="bmi" name="bmi" readonly>
</div>

<button type="submit" class="next-btn">Next →</button>

</form>

</div>
</div>

<script>

function calculateBMI(){

    let height = document.getElementById("height").value;
    let weight = document.getElementById("weight").value;

    if(height && weight){

        let bmi = weight / ((height/100) * (height/100));
        bmi = bmi.toFixed(2);

        document.getElementById("bmi").value = bmi;
    }else{
        document.getElementById("bmi").value = "";
    }
}

</script>

</body>
</html>
