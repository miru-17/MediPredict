<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MediPredict</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            background: url("{{ url_for('static', filename='images/bg.png') }}") no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.05);
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        .logo {
            width: 500px;
            margin-bottom: 40px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #00e6ff); }
            to { filter: drop-shadow(0 0 30px #00e6ff); }
        }

        .btn {
            padding: 20px 60px;
            font-size: 22px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00e6ff, #007bff);
            box-shadow: 0 0 20px #00e6ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px #00e6ff; }
            50% { box-shadow: 0 0 40px #00e6ff; }
            100% { box-shadow: 0 0 20px #00e6ff; }
        }
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="MediPredict Logo">
    <br>
    <a href="{{ url_for('login') }}" class="btn">Get Started</a>
</div>

</body>
</html>
