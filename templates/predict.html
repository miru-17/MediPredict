{% extends "layout.html" %}
{% block content %}

<div class="health-container">

<h2> Health Risk Assessment</h2>

<form method="POST">

<!-- STEP 1 -->
<div class="step" id="step1">

<h3>Step 1 → Personal Information</h3>

<label>Full Name</label>
<input type="text" name="name" required>

<label>Age</label>
<input type="number" name="age" required>

<label>Gender</label>
<select name="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Height (cm)</label>
<input type="number" name="height">

<label>Weight (kg)</label>
<input type="number" name="weight">

<label>Family History</label>
<select name="family_history">
<option>No</option>
<option>Yes</option>
</select>

<button type="button" onclick="nextStep(1)">Next</button>

</div>


<!-- STEP 2 -->
<div class="step" id="step2">

<h3>Step 2 → Lifestyle</h3>

<label>Smoking</label>
<select name="smoking">
<option>Never</option>
<option>Former</option>
<option>Current</option>
</select>

<label>Alcohol</label>
<select name="alcohol">
<option>Never</option>
<option>Occasionally</option>
<option>Frequent</option>
</select>

<label>Physical Activity</label>
<select name="activity">
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

<label>Sleep Hours</label>
<input type="number" name="sleep">

<label>Stress Level</label>
<select name="stress">
<option>Low</option>
<option>Moderate</option>
<option>High</option>
</select>

<button type="button" onclick="prevStep(2)">Back</button>
<button type="button" onclick="nextStep(2)">Next</button>

</div>


<!-- STEP 3 -->
<div class="step" id="step3">

<h3>Step 3 → Medical History</h3>

<label>Diabetes</label>
<select name="diabetes">
<option>No</option>
<option>Yes</option>
</select>

<label>Hypertension</label>
<select name="hypertension">
<option>No</option>
<option>Yes</option>
</select>

<label>Heart Disease</label>
<select name="heart_disease">
<option>No</option>
<option>Yes</option>
</select>

<button type="button" onclick="prevStep(3)">Back</button>
<button type="button" onclick="nextStep(3)">Next</button>

</div>


<!-- STEP 4 -->
<div class="step" id="step4">

<h3>Step 4 → Symptoms</h3>

<label>
<input type="checkbox" name="symptoms" value="fever">
Fever
</label>

<label>
<input type="checkbox" name="symptoms" value="cough">
Cough
</label>

<label>
<input type="checkbox" name="symptoms" value="headache">
Headache
</label>

<label>
<input type="checkbox" name="symptoms" value="fatigue">
Fatigue
</label>

<br><br>

<button type="button" onclick="prevStep(4)">Back</button>

<button type="submit" class="predict-btn">
Generate AI Risk Report
</button>

</div>

</form>

</div>

{% endblock %}
<script>

function nextStep(step){

document.getElementById("step"+step).style.display="none";
document.getElementById("step"+(step+1)).style.display="block";

}

function prevStep(step){

document.getElementById("step"+step).style.display="none";
document.getElementById("step"+(step-1)).style.display="block";

}

</script>
