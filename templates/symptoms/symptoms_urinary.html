<!DOCTYPE html>
<html>

<head>

<title>MediPredict</title>

<style>

body{
margin:0;
font-family:Arial;
background-image:url("{{url_for('static',filename='images/bg.png')}}");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.header{
background:#0d2a52;
color:white;
padding:30px;
text-align:center;
font-size:26px;
font-weight:bold;
position:fixed;
top:0;
width:100%;
}

.sidebar{
position:fixed;
left:0;
top:95px;
width:240px;
height:100%;
background:#ff2a5a;
}

.sidebar a{
display:block;
color:white;
padding:14px;
text-decoration:none;
}

.sidebar a:hover{
background:#e11d48;
}

.main{
margin-left:240px;
margin-top:110px;
padding:40px;
}

.symptom-box{

background:white;
width:1000px;
margin:auto;
padding:40px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.2);

}

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;

}

.symptom{

padding:12px;
border-radius:8px;
background:#f1f5f9;
font-size:17px;

}

.symptom:hover{

background:#dbeafe;

}

.predict-btn{

width:100%;
padding:16px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
cursor:pointer;
margin-top:20px;

}

.predict-btn:hover{

background:#15803d;

}

.prev-btn{

width:100%;
padding:14px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:8px;
background:#6b7280;
color:white;
cursor:pointer;
margin-top:10px;

}

.progress{

font-weight:bold;
color:#2563eb;

}

</style>

</head>

<body>

<div class="header">

MediPredict – Health Risk Analyser

</div>


<div class="sidebar">

<a href="#">Predict Disease</a>
<!--<a href="#">Prediction History</a>-->
<a href="#">View Health Recommendations</a>
<a href="#">View Profile</a>

<a href="#">Logout</a>

</div>


<div class="main">

<div class="symptom-box">

<h2>Urinary & Kidney Symptoms</h2>

<p class="progress">



</p>


<form method="POST">

<div class="grid">

<label class="symptom">
<input type="checkbox" name="symptoms" value="burning_micturition">
Burning micturition
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="spotting_urination">
Spotting urination
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="continuous_feel_of_urine">
Continuous feel of urine
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="foul_smell_of_urine">
Foul smell of urine
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="bladder_discomfort">
Bladder discomfort
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="polyuria">
Polyuria
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="dark_urine">
Dark urine
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="yellow_urine">
Yellow urine
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="fluid_overload">
Fluid overload
</label>

<label class="symptom">
<input type="checkbox" name="symptoms" value="swollen_extremeties">
Swollen extremities
</label>

</div>

<button type="submit" class="predict-btn">

🔍 Predict Now

</button>

<button
type="button"
class="prev-btn"
onclick="window.location.href='{{url_for('symptoms_heart')}}'">

← Previous

</button>

</form>



</div>

</div>

</body>

</html>
